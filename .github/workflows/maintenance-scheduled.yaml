name: Scheduled Component File Update

on:
  # Daily at 2:01AM https://crontab.guru/
  schedule:
    - cron: '1 2 * * *'

jobs:
  maintenance_updates:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo (existing branch)
        uses: actions/checkout@v6
        id: bad-checkout
        continue-on-error: true
        with:
          ref: maintenance-branch
        # If the first checkout fails, we checkout the `develop` branch by default
      - name: Fallback to default branch
        if: steps.bad-checkout.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        
      - name: Install EPATADA package
        run: |
          install.packages("remotes")
          library(remotes)
          remotes::install_github("USEPA/EPATADA", ref = "develop", dependencies = TRUE, force = TRUE)
        shell: Rscript {0}
        
      - name: Update reference files
        run: |
          library(EPATADA)
          EPATADA:::.TADA_UpdateRefFiles()
        shell: Rscript {0}

      - name: Commit updated reference files
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'github-actions[bot]'
          author_email: 'github-actions[bot]@users.noreply.github.com'
          message: "Update reference files"
          add: '[./inst/extdata/*]'
          new_branch: maintenance-branch

      - name: Update example data
        run: |
          library(EPATADA)
          EPATADA:::.TADA_UpdateExampleData()
        shell: Rscript {0}

      - name: Commit updated example data
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'github-actions[bot]'
          author_email: 'github-actions[bot]@users.noreply.github.com'
          message: "Update example data"
          add: '[./data/*]'
          new_branch: maintenance-branch
          
