name: coverage

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
  # Kick PR-based run after Prerequisites completes
  workflow_run:
    workflows: ["Prerequisites"]
    types: [completed]

permissions:
  actions: write       # needed to request reruns
  contents: read
  checks: write
  pull-requests: write

# Concurrency:
# - PR runs: one active run per PR number (older runs are cancelled when new commits arrive)
# - workflow_run: unique per "Prerequisites" run id (to avoid cross-cancellation)
concurrency:
  group: coverage-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.workflow_run.head_sha }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  gate-coverage:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      run_cov: ${{ steps.gate.outputs.run_cov }}
    steps:
      - name: Decide whether to run Coverage (and kick PR re-run after prerequisites)
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // For PR runs: proceed only once "Prerequisites" succeeded and base is develop
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              if ((pr.base?.ref || '') !== 'develop') {
                core.setOutput('run_cov', 'false');
                return;
              }

              // Locate "Prerequisites" workflow
              const wfs = await github.rest.actions.listRepoWorkflows({ owner, repo });
              const prereq = wfs.data.workflows.find(w => w.name === 'Prerequisites');
              if (!prereq) {
                core.setOutput('run_cov', 'false');
                return;
              }

              // Find latest completed Prerequisites run for this head SHA
              const headSha = pr.head.sha;
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: prereq.id, event: 'pull_request', head_sha: headSha, status: 'completed', per_page: 1
              });
              const run = runs.data.workflow_runs?.[0];
              if (!run || run.conclusion !== 'success') {
                core.setOutput('run_cov', 'false');
                return;
              }

              // Verify Format success and Spelling success or skipped
              const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id });
              const byName = n => jobs.data.jobs.find(j => (j.name || '').toLowerCase() === n);
              const fmt = byName('format');    // matches job name: "Format"
              const spl = byName('spelling');  // matches job name: "Spelling"
              const fmtOk = fmt && fmt.conclusion === 'success';
              const splOk = spl && (spl.conclusion === 'success' || spl.conclusion === 'skipped');

              core.setOutput('run_cov', (fmtOk && splOk) ? 'true' : 'false');
              return;
            }

            // After successful Prerequisites (PR-triggered), rerun latest PR-based coverage so it attaches to the PR
            if (context.eventName === 'workflow_run') {
              const wr = context.payload.workflow_run;

              if ((wr.name || '') !== 'Prerequisites' || wr.conclusion !== 'success') {
                core.setOutput('run_cov', 'false');
                return;
              }
              const isPR = wr.event === 'pull_request' || wr.event === 'pull_request_target';
              if (!isPR) {
                core.setOutput('run_cov', 'false');
                return;
              }

              // Confirm PR base is develop
              let prs = wr.pull_requests || [];
              if (!prs || prs.length === 0) {
                const assoc = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: wr.head_sha
                });
                prs = assoc.data;
              }
              const baseDevelop = prs.some(pr => pr?.base?.ref === 'develop');
              if (!baseDevelop) {
                core.setOutput('run_cov', 'false');
                return;
              }

              // Find this workflow (coverage)
              const wfs = await github.rest.actions.listRepoWorkflows({ owner, repo });
              const self = wfs.data.workflows.find(w => w.name === 'coverage');
              if (!self) {
                core.setOutput('run_cov', 'false');
                return;
              }

              // Find latest PR-based run for same head SHA and rerun it
              const prRuns = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: self.id, event: 'pull_request', head_sha: wr.head_sha, per_page: 1
              });
              const prRun = prRuns.data.workflow_runs?.[0];
              if (prRun) {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {
                  owner, repo, run_id: prRun.id
                });
              }
              core.setOutput('run_cov', 'false');
              return;
            }

            core.setOutput('run_cov', 'false');

  coverage-on-pr:
    name: Coverage on PRs to develop
    needs: gate-coverage
    if: needs.gate-coverage.outputs.run_cov == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Capture Environment Info
        shell: Rscript {0}
        run: |
          env_vars <- Sys.getenv()
          pkg_versions <- installed.packages()[, c("Package", "Version")]
          sys_info <- Sys.info()
          save(env_vars, pkg_versions, sys_info, file = "ci_env_info.RData")

      - name: Upload Environment Info
        uses: actions/upload-artifact@v6
        with:
          name: ci_env_info
          path: ci_env_info.RData

      - name: Test coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")

      - name: Show testthat output
        if: always()
        shell: bash
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ./cobertura.xml
          if-no-files-found: ignore

      - name: Comment coverage on PR (same-repo PRs to develop only)
        if: hashFiles('cobertura.xml') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: 5monkeys/cobertura-action@master
        with:
          report_name: coverage-report
          path: ./cobertura.xml
          minimum_coverage: 10
          show_missing: true
          link_missing_lines: true
