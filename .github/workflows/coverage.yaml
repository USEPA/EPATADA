name: coverage

on:
  workflow_run:
    workflows: ["spelling"]
    types: [completed]

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

jobs:
  coverage-on-pr:
    name: Coverage on PRs to develop (after spelling; formatting verified)
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Include workflow_run.id to avoid accidental cancellation collisions
      group: coverage-pr-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Verify formatting succeeded (and PR base is develop)
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const wr = context.payload.workflow_run;
            const headSha = wr.head_sha;

            // Ensure PR base branch is develop
            let prBaseOk = false;
            if (wr.event === 'pull_request' || wr.event === 'pull_request_target') {
              let prs = wr.pull_requests || [];
              if (!prs || prs.length === 0) {
                const assoc = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: headSha
                });
                prs = assoc.data;
              }
              prBaseOk = prs.some(pr => pr?.base?.ref === 'develop');
            }

            // Verify Automated Formatting succeeded for the same SHA
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const formattingWf = workflows.workflows.find(wf => wf.name === 'Automated Formatting');
            let formattingOk = false;
            if (formattingWf) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: formattingWf.id, per_page: 100
              });
              const match = runs.data.workflow_runs.find(r =>
                r.head_sha === headSha && (r.event === 'pull_request' || r.event === 'pull_request_target')
              );
              formattingOk = !!(match && match.conclusion === 'success');
            }

            const ok = prBaseOk && formattingOk;
            core.setOutput('ok', ok ? 'true' : 'false');
            core.info(`Prereq check: ok=${ok}. PR base OK=${prBaseOk}. Automated Formatting OK=${formattingOk}.`);

      - name: Check out the same commit
        if: steps.verify.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        if: steps.verify.outputs.ok == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.verify.outputs.ok == 'true'
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Capture Environment Info
        if: steps.verify.outputs.ok == 'true'
        shell: Rscript {0}
        run: |
          env_vars <- Sys.getenv()
          pkg_versions <- installed.packages()[, c("Package", "Version")]
          sys_info <- Sys.info()
          save(env_vars, pkg_versions, sys_info, file = "ci_env_info.RData")

      - name: Upload Environment Info
        if: steps.verify.outputs.ok == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ci_env_info
          path: ci_env_info.RData

      - name: Test coverage
        if: steps.verify.outputs.ok == 'true'
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")

      - name: Show testthat output
        if: always() && steps.verify.outputs.ok == 'true'
        shell: bash
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload test results
        if: failure() && steps.verify.outputs.ok == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
          if-no-files-found: ignore

      - name: Upload coverage report
        if: steps.verify.outputs.ok == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ./cobertura.xml
          if-no-files-found: ignore

      - name: Comment coverage on PR (develop only)
        if: steps.verify.outputs.ok == 'true' && hashFiles('cobertura.xml') != '' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target')
        uses: 5monkeys/cobertura-action@master
        with:
          report_name: coverage-report
          path: ./cobertura.xml
          minimum_coverage: 10
          show_missing: true
          link_missing_lines: true
