name: style-formating

on:
  pull_request:
    branches:
      [develop]
  push:
    branches:
      [develop, 674-pre-commit-formattinglinting]
    
jobs:
  style-formating:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
         
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: install packages
        run: R -e 'install.packages("precommit")'

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure
