name: Prerequisites

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: prerequisites-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-pr:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Allow formatting on bot-opened PRs; skip only bot-triggered synchronize runs
    if: github.event.pull_request.draft == false && (github.actor != 'github-actions[bot]' || github.event.action != 'synchronize')
    outputs:
      pushed: ${{ steps.pushed.outputs.value }}

    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Air formatter
        uses: posit-dev/setup-air@v1

      - name: Format with air
        env:
          GITHUB_TOKEN: ""
        run: air format .

      - name: Commit and push formatting changes (same-repo PRs only)
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: pushfmt
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No formatting changes to commit."
            echo "pushed=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "style: apply formatting via air"

          set +e
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.event.pull_request.head.repo.full_name }}.git" \
                   "HEAD:${{ github.event.pull_request.head.ref }}"
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Formatting changes pushed."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Could not push formatting changes (fork PR or policy blocked)."
          fi

      - name: Set pushed output
        if: always()
        id: pushed
        shell: bash
        run: |
          val="${{ steps.pushfmt.outputs.pushed }}"
          if [ -z "$val" ]; then val="none"; fi
          echo "value=$val" >> "$GITHUB_OUTPUT"

  spelling-initial:
    name: Spelling
    needs: format-pr
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]' && needs.format-pr.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out PR head commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies (spelling) with cache
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: any::spelling

      - name: Run spellcheck and capture output
        id: spellcheck
        env:
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          set -o pipefail
          CMD='result <- spelling::spell_check_package(); print(result); if (nrow(result) != 0) stop("Spelling errors found (fix or add to WORDLIST)")'
          if Rscript -e "$CMD" 2>&1 | tee spellcheck.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR with spelling results (same-repo PRs only)
        if: steps.spellcheck.outputs.ok == 'false' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.issue.number;

            let log = fs.readFileSync('spellcheck.log', 'utf8');
            const max = 65000;
            if (log.length > max) {
              log = log.slice(0, max) + '\n… (truncated)';
            }

            const body = [
              '<!-- spellcheck-report -->',
              'Spelling check failed. Details:',
              '',
              '```',
              log.trim(),
              '```'
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            } catch (error) {
              core.warning(`Could not post comment: ${error?.message || error}`);
            }

      - name: Fail job if spelling errors
        if: steps.spellcheck.outputs.ok == 'false'
        run: exit 1

  spelling-after-formatter-push:
    name: Spelling (after formatter push)
    # Run on any synchronize, then verify the commit is from the formatter
    if: github.event.pull_request.draft == false && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Verify head commit is the formatter push
        id: verifyfmt
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const full = context.payload.pull_request.head.repo?.full_name || '';
            let proceed = false;
            let msg = '';
            let committerName = '';
            let committerEmail = '';

            if (sha && full && full.includes('/')) {
              const [headOwner, headRepo] = full.split('/');
              try {
                const { data } = await github.rest.repos.getCommit({ owner: headOwner, repo: headRepo, ref: sha });
                msg = data?.commit?.message || '';
                committerName = data?.commit?.committer?.name || '';
                committerEmail = data?.commit?.committer?.email || '';
                const isFormatterMsg = msg.startsWith('style: apply formatting via air');
                const isBotCommitter = committerName === 'github-actions[bot]' && (committerEmail || '').includes('users.noreply.github.com');
                // Stricter gating to avoid false positives
                proceed = isFormatterMsg && isBotCommitter;
              } catch (error) {
                // Could be a private fork; in that case, do not proceed
                proceed = false;
                core.info(`Could not fetch commit ${sha} from ${full}: ${error?.message || error}`);
              }
            }

            core.setOutput('proceed', proceed ? 'true' : 'false');
            core.info(`Head commit ${sha} from ${full}: proceed=${proceed} (msg='${msg}', committer='${committerName}', email='${committerEmail}')`);

      - name: Check out PR head commit (new commit from formatter)
        if: steps.verifyfmt.outputs.proceed == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        if: steps.verifyfmt.outputs.proceed == 'true'
        with:
          use-public-rspm: true

      - name: Install dependencies (spelling) with cache
        if: steps.verifyfmt.outputs.proceed == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: any::spelling

      - name: Run spellcheck and capture output
        if: steps.verifyfmt.outputs.proceed == 'true'
        id: spellcheck
        env:
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          set -o pipefail
          CMD='result <- spelling::spell_check_package(); print(result); if (nrow(result) != 0) stop("Spelling errors found (fix or add to WORDLIST)")'
          if Rscript -e "$CMD" 2>&1 | tee spellcheck.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR with spelling results (same-repo PRs only)
        if: steps.verifyfmt.outputs.proceed == 'true' && steps.spellcheck.outputs.ok == 'false' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.issue.number;

            let log = fs.readFileSync('spellcheck.log', 'utf8');
            const max = 65000;
            if (log.length > max) {
              log = log.slice(0, max) + '\n… (truncated)';
            }

            const body = [
              '<!-- spellcheck-report -->',
              'Spelling check failed. Details:',
              '',
              '```',
              log.trim(),
              '```'
            ].join('\n');

            try {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            } catch (error) {
              core.warning(`Could not post comment: ${error?.message || error}`);
            }

      - name: Fail job if spelling errors
        if: steps.verifyfmt.outputs.proceed == 'true' && steps.spellcheck.outputs.ok == 'false'
        run: exit 1
