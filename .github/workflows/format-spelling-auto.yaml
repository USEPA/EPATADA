name: Prerequisites

on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: prerequisites-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-pr:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pushed: ${{ steps.pushed.outputs.value }}

    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Air formatter
        if: github.actor != 'github-actions[bot]' && github.event.pull_request.draft == false
        uses: posit-dev/setup-air@v1

      - name: Format with air (same-repo PRs)
        if: github.actor != 'github-actions[bot]' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ""
        run: air format .

      - name: Commit and push formatting changes
        if: github.actor != 'github-actions[bot]' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        id: pushfmt
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No formatting changes to commit."
            echo "pushed=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "style: apply formatting via air"

          set +e
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.event.pull_request.head.repo.full_name }}.git" \
                   "HEAD:${{ github.event.pull_request.head.ref }}"
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Formatting changes pushed."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Could not push formatting changes (likely fork or edits disabled)."
          fi

      - name: Format (fork PRs)
        if: github.actor != 'github-actions[bot]' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name != github.repository
        env:
          GITHUB_TOKEN: ""
        run: air format .

      - name: Suggest formatting changes on PR (forks)
        if: github.actor != 'github-actions[bot]' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name != github.repository
        continue-on-error: true
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: air
          level: warning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post guidance comment (fork PRs, only if changes found)
        if: github.actor != 'github-actions[bot]' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        shell: bash
        run: |
          if ! git diff --quiet; then
            pr=${{ github.event.pull_request.number }}
            body=$(cat <<'MD'
Thanks for the contribution! The formatter found issues.

Because this PR comes from a fork, the bot cannot push fixes. Please:
- Install Air: https://github.com/posit-dev/setup-air
- Run: air format .
- Commit and push the changes
MD
            )
            gh pr comment "$pr" -R "${{ github.repository }}" --body "$body"
          fi

      - name: Set pushed output
        if: always()
        id: pushed
        shell: bash
        run: |
          val="${{ steps.pushfmt.outputs.pushed }}"
          if [ -z "$val" ]; then val="none"; fi
          echo "value=$val" >> "$GITHUB_OUTPUT"

  spelling:
    name: Spelling
    needs: format-pr
    if: github.event.pull_request.draft == false && needs.format-pr.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out PR head commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install spellchecker
        env:
          GITHUB_TOKEN: ""
        shell: Rscript {0}
        run: install.packages("spelling")

      - name: Run spellcheck and capture output
        id: spellcheck
        env:
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          set -o pipefail
          CMD='result <- spelling::spell_check_package(); print(result); if (nrow(result) != 0) stop("Spelling errors found (fix or add to WORDLIST)")'
          if Rscript -e "$CMD" 2>&1 | tee spellcheck.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR with spelling results (on failure)
        if: steps.spellcheck.outputs.ok == 'false'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.issue.number;

            let log = fs.readFileSync('spellcheck.log', 'utf8');
            const max = 65000;
            if (log.length > max) {
              log = log.slice(0, max) + '\n… (truncated)';
            }

            const body = [
              '<!-- spellcheck-report -->',
              'Spelling check failed. Details:',
              '',
              '```',
              log.trim(),
              '```'
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            } catch (error) {
              core.warning(`Could not post comment: ${error?.message || error}`);
            }

      - name: Fail job if spelling errors
        if: steps.spellcheck.outputs.ok == 'false'
        run: exit 1
