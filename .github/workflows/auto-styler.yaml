name: Suggest Code Style Changes

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  suggest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'latest'

    - name: Install styler
      run: Rscript -e 'install.packages("styler")'

    - name: Style package and generate diff
      run: |
        Rscript -e 'styler::style_pkg()'
        git diff > styled.diff

    - name: Create suggestions
      uses: juliangruber/suggestion-action@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        diff-file: styled.diff
