name: test-coverage

on:
  workflow_run:
    workflows: ["R-CMD-check"]   # Must match the 'name:' in your check workflow
    types: [completed]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test-coverage:
    # Run after successful R-CMD-check for:
    # - push to develop, OR
    # - any pull_request
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop') ||
        (github.event.workflow_run.event == 'pull_request')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: coverage-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out the same commit that passed R-CMD-check
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # r-version: '4.3'  # Optionally pin for reproducibility

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
          # cache: true       # Optional: speed up repeated runs

      - name: Capture Environment Info
        shell: Rscript {0}
        run: |
          env_vars <- Sys.getenv()
          pkg_versions <- installed.packages()[, c("Package", "Version")]
          sys_info <- Sys.info()
          save(env_vars, pkg_versions, sys_info, file = "ci_env_info.RData")

      - name: Upload Environment Info
        uses: actions/upload-artifact@v6
        with:
          name: ci_env_info
          path: ci_env_info.RData

      - name: Test coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")

      - name: Show testthat output
        if: always()
        shell: bash
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ./cobertura.xml
          if-no-files-found: ignore

      - name: Comment coverage on PR
        if: hashFiles('cobertura.xml') != '' && github.event.workflow_run.event == 'pull_request'
        uses: 5monkeys/cobertura-action@vX.Y.Z   # pin to a released tag or commit SHA
        with:
          report_name: coverage-report
          path: ./cobertura.xml
          minimum_coverage: 10
          show_missing: true
          link_missing_lines: true
