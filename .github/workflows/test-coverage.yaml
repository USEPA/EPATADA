# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: test-coverage

# Cancel older runs on the same PR/branch when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: read
  pull-requests: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

    steps:
      - name: Wait for pre-commit.ci
        if: ${{ github.event_name == 'pull_request' }}
        uses: lewagon/wait-on-check@v1.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: pre-commit.ci - pr
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Capture Environment Info
        run: |
          Rscript -e '
            env_vars <- Sys.getenv()
            pkg_versions <- installed.packages()[, c("Package", "Version")]
            sys_info <- Sys.info()
            save(env_vars, pkg_versions, sys_info, file = "ci_env_info.RData")
          '

      - name: Upload Environment Info
        uses: actions/upload-artifact@v7
        with:
          name: ci_env_info
          path: ci_env_info.RData

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./cobertura.xml

      - name: Comment coverage
        uses: 5monkeys/cobertura-action@master
        with:
          report_name: coverage-report
          path: ./cobertura.xml
          minimum_coverage: 10
          show_missing: true
          link_missing_lines: true
