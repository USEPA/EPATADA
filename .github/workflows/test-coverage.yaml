on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: read
  statuses: read
  pull-requests: write

jobs:
  test-coverage:
    # Skip draft PRs; run on non-PR triggers and non-draft PR events
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

    steps:
      - name: Wait for pre-commit.ci to succeed
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const names = ['pre-commit.ci - pr', 'pre-commit.ci - push'];
            const timeoutMs = 15 * 60 * 1000;
            const intervalMs = 10 * 1000;
            const started = Date.now();

            async function getStatus() {
              const checks = await github.rest.checks.listForRef({ owner, repo, ref });
              const cr = checks.data.check_runs.find(r => names.includes(r.name));
              if (cr) {
                if (cr.status === 'completed') return cr.conclusion || 'failure';
                return 'pending';
              }
              const status = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref });
              const st = status.data.statuses.find(s => names.includes(s.context));
              if (st) return st.state;
              return null;
            }

            while (true) {
              const s = await getStatus();
              if (s === 'success') { core.info('pre-commit.ci status: success'); break; }
              if (['failure','error','cancelled','timed_out','neutral','skipped'].includes(s)) {
                core.setFailed(`pre-commit.ci concluded with: ${s}`); break;
              }
              core.info(`Waiting for pre-commit.ci... (status: ${s ?? 'not yet created'})`);
              if (Date.now() - started > timeoutMs) { core.setFailed('Timed out waiting for pre-commit.ci to report'); break; }
              await new Promise(r => setTimeout(r, intervalMs));
            }

      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Capture Environment Info
        run: |
          Rscript -e '
            env_vars <- Sys.getenv()
            pkg_versions <- installed.packages()[, c("Package", "Version")]
            sys_info <- Sys.info()
            save(env_vars, pkg_versions, sys_info, file = "ci_env_info.RData")
          '

      - name: Upload Environment Info
        uses: actions/upload-artifact@v7
        with:
          name: ci_env_info
          path: ci_env_info.RData

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./cobertura.xml

      - name: Comment coverage
        uses: 5monkeys/cobertura-action@master
        with:
          report_name: coverage-report
          path: ./cobertura.xml
          minimum_coverage: 10
          show_missing: true
          link_missing_lines: true
