on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  statuses: read
  pull-requests: write

jobs:
  test-coverage:
    # Skip draft PRs; run on non-PR triggers and non-draft PR events
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Capture Environment Info
        run: |
          Rscript -e '
            env_vars <- Sys.getenv()
            pkg_versions <- installed.packages()[, c("Package", "Version")]
            sys_info <- Sys.info()
            save(env_vars, pkg_versions, sys_info, file = "ci_env_info.RData")
          '

      - name: Upload Environment Info
        uses: actions/upload-artifact@v7
        with:
          name: ci_env_info
          path: ci_env_info.RData

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./cobertura.xml

      - name: Comment coverage
        uses: 5monkeys/cobertura-action@master
        with:
          report_name: coverage-report
          path: ./cobertura.xml
          minimum_coverage: 10
          only_changed_files: true   # limit to files modified in the PR
          show_missing: true
          link_missing_lines: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        # Generate a detailed comment file
      - name: Build detailed coverage comment
        run: |
          Rscript -e '
          suppressPackageStartupMessages({
            if (!requireNamespace("xml2", quietly = TRUE)) install.packages("xml2", repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest")
            if (!requireNamespace("dplyr", quietly = TRUE)) install.packages("dplyr", repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest")
            if (!requireNamespace("purrr", quietly = TRUE)) install.packages("purrr", repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest")
          })
          library(xml2); library(dplyr); library(purrr)
          doc <- read_xml("cobertura.xml")
          classes <- xml_find_all(doc, "//class")
          misses <- map_df(classes, function(cls) {
            file <- xml_attr(cls, "filename")
            lines <- xml_find_all(cls, ".//lines/line")
            tibble(
              file = file,
              number = as.integer(xml_attr(lines, "number")),
              hits = as.integer(xml_attr(lines, "hits"))
            )
          }) %>% filter(hits == 0)
          # Build markdown, grouped by file
          md <- c("# Coverage details (missed lines)",
                  dplyr::group_split(misses, file) %>% purrr::map_chr(function(df) {
                    paste0("## ", unique(df$file), "\n- Missed lines: ", paste(df$number, collapse = ", "))
                  })
          )
          writeLines(md, "coverage_missing.md")
          '
      
      # Post the markdown in chunks (multiple comments)
      - uses: actions/github-script@v7
        # if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage_missing.md', 'utf8');
            const maxLen = 64000; // safe chunk size below GitHub's 65,535 limit
      
            const issue_number = context.payload.pull_request.number;
            for (let i = 0; i < body.length; i += maxLen) {
              const chunk = body.slice(i, i + maxLen);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: chunk
              });
            }
