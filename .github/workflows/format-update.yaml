# Combined PR auto-format and manual format-update workflow
name: formatting

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  # Auto-format on PRs
  format-pr:
    if: github.event_name == 'pull_request_target' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install air
        uses: posit-dev/setup-air@v1

      # Same-repo PRs: format and try to push changes
      - name: Format with air (same-repo PRs)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          # Avoid exposing token to tools that process untrusted code
          GITHUB_TOKEN: ""
        run: air format .

      - name: Commit and push formatting changes
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        id: pushfmt
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No formatting changes to commit."
            echo "pushed=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "style: apply formatting via air"

          set +e
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.event.pull_request.head.repo.full_name }}.git" \
                   "HEAD:${{ github.event.pull_request.head.ref }}"
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Formatting changes pushed."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Could not push formatting changes (likely fork or edits disabled)."
          fi

      # Fork PRs: check formatting and fail with a helpful comment
      - name: Check formatting (fork PRs, no push)
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          set -e
          if air format --check .; then
            echo "Formatting is correct."
          else
            echo "Formatting issues detected."
            exit 1
          fi

      - name: Comment on PR about formatting (fork PRs)
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository && failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=${{ github.event.pull_request.number }}
          body=$(cat <<'MD'
          Thanks for the contribution! The formatter found issues.

          Because this PR comes from a fork, the bot cannot push fixes. Please:
          - Install Air: https://github.com/posit-dev/setup-air
          - Run: air format .
          - Commit and push the changes

          Alternatively, a maintainer can run the "format-update" workflow on a branch in this repository.
          MD
          )
          gh pr comment "$pr" --body "$body"

      # Trigger CI only when the PR is not a draft and the event is the initial open or ready_for_review.
      # This ensures checks run AFTER formatting has completed.
      - name: Trigger checks after formatting
        if: ${{ (github.event.action == 'opened' || github.event.action == 'ready_for_review') && github.event.pull_request.draft == false }}
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          json=$(cat <<'JSON'
          {
            "event_type": "ci_after_format",
            "client_payload": {
              "head_repo": "${{ github.event.pull_request.head.repo.full_name }}",
              "head_ref": "${{ github.event.pull_request.head.ref }}",
              "head_sha": "${{ github.event.pull_request.head.sha }}",
              "pr_number": ${{ github.event.pull_request.number }}
            }
          }
          JSON
          )
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/dispatches" \
            -d "${json}"

  # Manual, branch-local format-and-commit (run from Actions tab)
  format-update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install
        uses: posit-dev/setup-air@v1

      - name: Format
        run: air format .

      - name: Commit updates
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'github-actions[bot]'
          author_email: '41898282+github-actions[bot]@users.noreply.github.com'
          message: "style: apply formatting via air"
