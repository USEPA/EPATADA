# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build"
        required: true
        default: develop
        type: string

name: pkgdown

jobs:
  # Detect whether the PR includes "significant" changes.
  # Skipped for non-PR events.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      significant: ${{ steps.filter.outputs.significant }}
    steps:
      - name: Detect significant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          filters: |
            significant:
              - 'vignettes/**'
              - 'README.md'
              - '_pkgdown.yml'
              - 'pkgdown/**'

  pkgdown:
    runs-on: ubuntu-latest
    needs: [changes]
    # Run if:
    # - Not a PR (push/workflow_dispatch), OR
    # - PR has significant path changes, OR
    # - PR has a "significant" label (manual override)
    if: github.event_name != 'pull_request' || needs.changes.outputs.significant == 'true' || contains(github.event.pull_request.labels.*.name, 'significant')
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      # Checkout for manual runs (uses the ref provided in the Actions UI)
      - uses: actions/checkout@v6
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          ref: ${{ inputs.ref }}

      # Checkout for push/pull_request runs (default behavior)
      - uses: actions/checkout@v6
        if: ${{ github.event_name != 'workflow_dispatch' }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          
