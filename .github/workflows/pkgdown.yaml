# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: pkgdown

on:
  # Always run on pushes to develop
  push:
    branches: [develop]

  # Run after formatting and spelling-check complete (for PRs to develop)
  workflow_run:
    workflows: ["formatting", "spelling-check"]
    types: [completed]

  # Optional manual trigger
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.verify.outputs.ok }}
      note: ${{ steps.verify.outputs.note }}
    steps:
      - name: Verify prerequisites and routing
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const event = context.eventName;

            // Manual runs are allowed
            if (event === 'workflow_dispatch') {
              core.setOutput('ok', 'true');
              core.setOutput('note', 'Manual run — prerequisite check skipped.');
              return;
            }

            // Pushes to develop always allowed
            if (event === 'push') {
              const ref = context.ref || '';
              const isDevelop = ref.endsWith('/develop');
              core.setOutput('ok', isDevelop ? 'true' : 'false');
              core.setOutput('note', `Push event; ref=${ref}; allow=${isDevelop}`);
              return;
            }

            // For workflow_run from formatting/spelling-check:
            // - require PR base branch develop
            if (event !== 'workflow_run') {
              core.setOutput('ok', 'false');
              core.setOutput('note', `Unsupported event: ${event}`);
              return;
            }

            const wr = context.payload.workflow_run;
            const headSha = wr.head_sha;

            // Confirm PR base is develop
            let baseDevelopOk = false;
            if (wr.event === 'pull_request' || wr.event === 'pull_request_target') {
              let prs = wr.pull_requests || [];
              if (!prs || prs.length === 0) {
                const assoc = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: headSha
                });
                prs = assoc.data;
              }
              baseDevelopOk = prs.some(pr => pr?.base?.ref === 'develop');
            }

            // Require both prerequisite workflows to have succeeded for this head SHA
            const targetNames = new Set(['formatting', 'spelling-check']);
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: headSha, per_page: 100
            });

            const latestByName = {};
            for (const r of runs.data.workflow_runs) {
              if (targetNames.has(r.name)) {
                const prev = latestByName[r.name];
                if (!prev || new Date(r.created_at) > new Date(prev.created_at)) {
                  latestByName[r.name] = r;
                }
              }
            }

            const missing = [...targetNames].filter(n => !latestByName[n]);
            const failed = Object.entries(latestByName).filter(([n, r]) => r.conclusion !== 'success');

            const ok = baseDevelopOk && missing.length === 0 && failed.length === 0;
            core.setOutput('ok', ok ? 'true' : 'false');
            const note = `baseDevelopOk=${baseDevelopOk}; missing=${missing.join(', ') || 'none'}; failed=${failed.map(([n, r]) => `${n}:${r.conclusion}`).join(', ') || 'none'}; headSha=${headSha}; trigger=${wr.event}`;
            core.setOutput('note', note);
            core.info(`Gate result: ${note}`);

  pkgdown:
    needs: gate
    if: ${{ needs.gate.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && format('pkgdown-{0}', github.event.workflow_run.head_sha) || github.event_name == 'push' && format('pkgdown-push-{0}', github.sha) || format('pkgdown-manual-{0}', github.run_id) }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
      # Checkout per event type
      - name: Check out exact commit (workflow_run)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check out (push)
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Deploy only on pushes to develop
      - name: Deploy to GitHub pages 🚀
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
