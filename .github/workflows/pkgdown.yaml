on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

name: pkgdown

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: read
  statuses: read

jobs:
  pkgdown:
    # Skip draft PRs; run on non-PR triggers and non-draft PR events
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}
    steps:
      - name: Wait for pre-commit.ci to succeed
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const names = ['pre-commit.ci - pr', 'pre-commit.ci - push'];
            const timeoutMs = 15 * 60 * 1000;
            const intervalMs = 10 * 1000;
            const started = Date.now();

            async function getStatus() {
              const checks = await github.rest.checks.listForRef({ owner, repo, ref });
              const cr = checks.data.check_runs.find(r => names.includes(r.name));
              if (cr) {
                if (cr.status === 'completed') return cr.conclusion || 'failure';
                return 'pending';
              }
              const status = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref });
              const st = status.data.statuses.find(s => names.includes(s.context));
              if (st) return st.state;
              return null;
            }

            while (true) {
              const s = await getStatus();
              if (s === 'success') { core.info('pre-commit.ci status: success'); break; }
              if (['failure','error','cancelled','timed_out','neutral','skipped'].includes(s)) {
                core.setFailed(`pre-commit.ci concluded with: ${s}`); break;
              }
              core.info(`Waiting for pre-commit.ci... (status: ${s ?? 'not yet created'})`);
              if (Date.now() - started > timeoutMs) { core.setFailed('Timed out waiting for pre-commit.ci to report'); break; }
              await new Promise(r => setTimeout(r, intervalMs));
            }

      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
