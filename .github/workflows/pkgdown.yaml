# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: pkgdown

on:
  # Always run on pushes to develop
  push:
    branches: [develop]

  # Run after spelling completes (for PRs to develop)
  workflow_run:
    workflows: ["spelling"]
    types: [completed]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.verify.outputs.ok }}
      note: ${{ steps.verify.outputs.note }}
    steps:
      - name: Verify prerequisites and routing
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const event = context.eventName;

            // Pushes to develop are always allowed
            if (event === 'push') {
              const ref = context.ref || '';
              const isDevelop = ref.endsWith('/develop');
              core.setOutput('ok', isDevelop ? 'true' : 'false');
              core.setOutput('note', `Push event; ref=${ref}; allow=${isDevelop}`);
              return;
            }

            // For workflow_run from spelling:
            if (event !== 'workflow_run') {
              core.setOutput('ok', 'false');
              core.setOutput('note', `Unsupported event: ${event}`);
              return;
            }

            const wr = context.payload.workflow_run;

            // Require the spelling run to have succeeded
            if (wr.conclusion !== 'success') {
              core.setOutput('ok', 'false');
              core.setOutput('note', `Spelling conclusion=${wr.conclusion}`);
              return;
            }

            const headSha = wr.head_sha;

            // Confirm PR base is develop
            let baseDevelopOk = false;
            if (wr.event === 'pull_request' || wr.event === 'pull_request_target') {
              let prs = wr.pull_requests || [];
              if (!prs || prs.length === 0) {
                const assoc = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: headSha
                });
                prs = assoc.data;
              }
              baseDevelopOk = prs.some(pr => pr?.base?.ref === 'develop');
            }

            // Verify "Automated Formatting" succeeded for this head SHA
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const formattingWf = workflows.workflows.find(wf => wf.name === 'Automated Formatting');

            let formattingOk = false;
            if (formattingWf) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: formattingWf.id, per_page: 100
              });
              const match = runs.data.workflow_runs.find(r =>
                r.head_sha === headSha &&
                (r.event === 'pull_request' || r.event === 'pull_request_target')
              );
              formattingOk = !!(match && match.conclusion === 'success');
            }

            const ok = baseDevelopOk && formattingOk;
            const note = `baseDevelopOk=${baseDevelopOk}; formattingOk=${formattingOk}; headSha=${headSha}; trigger=${wr.event}`;
            core.setOutput('ok', ok ? 'true' : 'false');
            core.setOutput('note', note);
            core.info(`Gate result: ${note}`);

  pkgdown:
    needs: gate
    if: ${{ needs.gate.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      # Use workflow_run.id to avoid cross-cancellation collisions; dedupe pushes by branch
      group: ${{ github.event_name == 'workflow_run' && format('pkgdown-{0}-{1}', github.event.workflow_run.head_sha, github.event.workflow_run.id) || format('pkgdown-push-{0}', github.ref) }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}
    permissions:
      contents: write

    steps:
      # Checkout per event type
      - name: Check out exact commit (workflow_run)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check out (push)
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Deploy only on pushes to develop
      - name: Deploy to GitHub pages 🚀
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
