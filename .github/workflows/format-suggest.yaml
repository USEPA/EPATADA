on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

name: format-commit

jobs:
  format-commit:
    # Skip when the actor is the bot (prevents the workflow from re-running on its own push)
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install air
        uses: posit-dev/setup-air@v1

      - name: Format with air
        run: air format .

      - name: Commit and push formatting changes
        id: pushfmt
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No formatting changes to commit."
            echo "pushed=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "style: apply formatting via air"

          set +e
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.event.pull_request.head.repo.full_name }}.git" \
                   "HEAD:${{ github.event.pull_request.head.ref }}"
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Formatting changes pushed."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Could not push formatting changes (maintainer edits disabled?)."
          fi

      # Trigger CI only when the PR is not a draft and the event is the initial open or ready_for_review.
      # This ensures checks run AFTER formatting has completed.
      - name: Trigger checks after formatting
        if: ${{ (github.event.action == 'opened' || github.event.action == 'ready_for_review') && github.event.pull_request.draft == false }}
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prepare repository_dispatch payload for downstream workflows
          json=$(cat <<'JSON'
          {
            "event_type": "ci_after_format",
            "client_payload": {
              "head_repo": "${{ github.event.pull_request.head.repo.full_name }}",
              "head_ref": "${{ github.event.pull_request.head.ref }}",
              "head_sha": "${{ github.event.pull_request.head.sha }}",
              "pr_number": ${{ github.event.pull_request.number }}
            }
          }
          JSON
          )
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/dispatches" \
            -d "${json}"
