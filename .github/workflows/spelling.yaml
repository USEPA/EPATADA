name: spelling

on:
  workflow_run:
    workflows: ["Automated Formatting"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.verify.outputs.ok }}
      note: ${{ steps.verify.outputs.note }}
    steps:
      - name: Verify formatting success and PR status
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const github = require('@actions/github');

            const wr = github.context.payload.workflow_run;
            const owner = github.context.repo.owner;
            const repo = github.context.repo.repo;

            // Must be a PR event and formatting must have succeeded
            if (wr.event !== 'pull_request' && wr.event !== 'pull_request_target') {
              core.setOutput('ok', 'false');
              core.setOutput('note', `Not a PR event: ${wr.event}`);
              return;
            }
            if (wr.conclusion !== 'success') {
              core.setOutput('ok', 'false');
              core.setOutput('note', `Automated Formatting conclusion: ${wr.conclusion}`);
              return;
            }

            const headSha = wr.head_sha;

            // Get associated PR(s) for this SHA
            let prs = wr.pull_requests || [];
            if (!prs || prs.length === 0) {
              const assoc = await github.getOctokit(process.env.GITHUB_TOKEN).rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: headSha
              });
              prs = assoc.data;
            }

            // Ensure base branch is develop and PR is not draft
            let ok = false;
            const octo = github.getOctokit(process.env.GITHUB_TOKEN);
            for (const pr of prs) {
              try {
                const { data: full } = await octo.rest.pulls.get({ owner, repo, pull_number: pr.number });
                const baseDevelop = full.base?.ref === 'develop';
                const notDraft = !full.draft;
                if (baseDevelop && notDraft) { ok = true; break; }
              } catch (e) {
                // ignore any fetch errors
              }
            }

            core.setOutput('ok', ok ? 'true' : 'false');
            core.setOutput('note', `ok=${ok}; headSha=${headSha}; event=${wr.event}`);

  spelling-check:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: spelling-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out PR head commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install spellchecker
        shell: Rscript {0}
        run: install.packages("spelling")

      - name: Spellcheck root directory (include vignettes)
        id: spellcheck
        shell: Rscript {0}
        run: |
          result <- spelling::spell_check_package()
          print(result)
          if (length(result[[1]]) != 0) {
            stop("Spelling errors found (fix or add to WORDLIST)")
          }
