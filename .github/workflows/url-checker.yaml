jobs:
  check_urls:
  runs-on: ubuntu-latest
steps:
  - uses: actions/checkout@v4.1.1 # Checkout your repository
- name: Setup R # Setup R on the runner
uses: r-lib/actions/setup-r@v2
with:
  r-version: 'release'
- name: Install urlchecker # Install the urlchecker package
run: |
  install.packages("urlchecker")
- name: Run urlchecker::url_check() # Run the URL check
run: |
  Rscript -e '
            library(urlchecker)
            # Assuming your package is at the root of the repository
            url_check(".") 
            # Or if in a subdirectory: url_check("path/to/your/package")
          '