# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: url-checker
jobs:
  check_urls:
  runs-on: ubuntu-latest
steps:
  - uses: actions/checkout@v4
- name: Setup R 
uses: r-lib/actions/setup-r@v2
with:
  r-version: 'release'
- name: Install urlchecker # Install the urlchecker package
run: |
  install.packages("urlchecker")
- name: Run urlchecker::url_check() # Run the URL check
run: |
  Rscript -e '
            library(urlchecker)
            # update urls
            urlchecker::url_update(".")
            
            # check package
            test <- urlchecker::url_check(".") 
          '