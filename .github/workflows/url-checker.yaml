on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    workflow_dispatch:

name: url-checker
jobs:
  check_urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup R
  
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install and run urlchecker
        run: |
          install.packages("urlchecker")

          Rscript -e '
            library(urlchecker)
            # update urls
            urlchecker::url_update(".")
            
            # check package
            urlchecker::url_check(".") 
          '
          