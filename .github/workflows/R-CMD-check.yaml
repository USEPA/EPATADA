# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

name: R-CMD-check

on:
  push:
    branches: [develop]

  # Triggered by the formatter after it completes (opened or ready_for_review)
  repository_dispatch:
    types: [ci_after_format]

  # Manual trigger (works for draft PR branches too)
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to check (optional)"
        required: false
        default: ""
      repository:
        description: "owner/repo to check (optional; defaults to this repo)"
        required: false
        default: ""

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel',   http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      # Checkout for formatter-dispatched PR runs
      - name: Check out PR head (dispatch)
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.head_repo }}
          ref: ${{ github.event.client_payload.head_ref }}
          fetch-depth: 0

      # Checkout for manual runs (optional ref/repo)
      - name: Check out (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      # Checkout for push runs
      - name: Check out (push)
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # PR-like runs (from formatter dispatch): fast check — skip vignettes/manual
      - name: R CMD check (dispatch/PR — skip vignettes)
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build-args: 'c("--no-build-vignettes")'
          args: 'c("--ignore-vignettes", "--no-manual")'
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"

      # Push to develop and manual runs: full check — build vignettes
      - name: R CMD check (push/manual — build vignettes)
        if: ${{ github.event_name != 'repository_dispatch' }}
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Optional: keep the manual off to avoid LaTeX on CI; remove to build the PDF manual too
          args: 'c("--no-manual")'
