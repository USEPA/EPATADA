# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [develop]
  # Trigger only after spelling completes; gate will verify Automated Formatting also succeeded
  workflow_run:
    workflows: ["spelling"]
    types: [completed]
  workflow_dispatch:

name: R-CMD-check

# Concurrency:
# - Pushes: one active run per branch (older runs on develop get cancelled)
# - PR workflow_run: unique group per workflow_run event to avoid cross-cancellation
concurrency:
  group: R-CMD-check-${{ github.event_name == 'push' && github.ref || github.event.workflow_run.head_sha }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

jobs:
  gate-prereqs:
    name: Gate prerequisites
    runs-on: ubuntu-latest
    outputs:
      run_check: ${{ steps.gate.outputs.run_check }}
    steps:
      - name: Decide whether to run R-CMD-check
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const isPush = context.eventName === 'push';
            if (isPush) {
              // Always run on push to develop
              core.setOutput('run_check', 'true');
              return;
            }
            if (context.eventName !== 'workflow_run') {
              core.setOutput('run_check', 'false');
              return;
            }

            const wr = context.payload.workflow_run;
            // Only proceed if the triggering workflow (spelling) for a PR completed successfully
            if (wr.conclusion !== 'success' || wr.event !== 'pull_request') {
              core.setOutput('run_check', 'false');
              return;
            }

            const headSha = wr.head_sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Ensure "Automated Formatting" also succeeded for the same PR commit
            const requiredNames = ["Automated Formatting"];
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({ owner, repo });

            const nameToId = new Map();
            for (const wf of workflows.workflows) {
              nameToId.set(wf.name, wf.id);
            }

            async function workflowSucceededForSha(name) {
              const id = nameToId.get(name);
              if (!id) return false;
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: id, per_page: 100
              });
              const match = runs.data.workflow_runs.find(r =>
                r.head_sha === headSha && r.event === 'pull_request'
              );
              return !!(match && match.conclusion === 'success');
            }

            let ok = true;
            for (const name of requiredNames) {
              const passed = await workflowSucceededForSha(name);
              if (!passed) { ok = false; break; }
            }
            core.setOutput('run_check', ok ? 'true' : 'false');

  R-CMD-check:
    needs: gate-prereqs
    if: needs.gate-prereqs.outputs.run_check == 'true'
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel',   http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    steps:
      # Checkout the right commit depending on the trigger
      - name: Checkout (push)
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Checkout (workflow_run for PR)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          install-system-requirements: true

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
