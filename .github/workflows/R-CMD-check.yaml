# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [develop]
  pull_request:
    branches: develop
  # allow manual action trigger
  workflow_dispatch:

name: R-CMD-check

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Also, cancel in-progress runs.
# concurrency:
#   group: "R-CMD-check"
#  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel',   http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Optional: avoid the NOTE on PRs by excluding vignettes from the built tarball
      - name: Ignore vignettes on PRs
        if: ${{ github.event_name == 'pull_request' }}
        shell: Rscript {0}
        run: |
          f <- ".Rbuildignore"
          p <- "^vignettes$"
          x <- if (file.exists(f)) readLines(f) else character()
          if (!any(grepl(p, x))) write(paste(c(x, p), collapse = "\n"), f)

      # PRs: fast check — skip vignettes (and manual)
      - name: R CMD check (PRs — skip vignettes)
        if: ${{ github.event_name == 'pull_request' }}
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build-args: 'c("--no-build-vignettes")'
          args: 'c("--no-vignettes", "--no-manual")'

      # Pushes to develop and manual runs: full check — build vignettes
      - name: R CMD check (push/develop — build vignettes)
        if: ${{ github.event_name != 'pull_request' }}
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Optional: keep the manual off to avoid LaTeX on CI; remove this line to build the PDF manual too
          args: 'c("--no-manual")'
