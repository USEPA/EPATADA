on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  R-CMD-check:
    # Skip draft PRs; run on non-PR triggers and non-draft PR events
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel',   http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

    steps:
      - name: Wait for pre-commit.ci to succeed
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const names = ['pre-commit.ci - pr', 'pre-commit.ci - push'];
            const timeoutMs = 15 * 60 * 1000;
            const intervalMs = 10 * 1000;
            const started = Date.now();

            async function getStatus() {
              // Try check runs first
              const checks = await github.rest.checks.listForRef({ owner, repo, ref });
              const cr = checks.data.check_runs.find(r => names.includes(r.name));
              if (cr) {
                if (cr.status === 'completed') return cr.conclusion || 'failure';
                return 'pending';
              }
              // Fallback to commit statuses (contexts)
              const status = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref });
              const st = status.data.statuses.find(s => names.includes(s.context));
              if (st) return st.state; // success | failure | error | pending
              return null;
            }

            while (true) {
              const s = await getStatus();
              if (s === 'success') {
                core.info('pre-commit.ci status: success');
                break;
              }
              if (s === 'failure' || s === 'error' || s === 'cancelled' || s === 'timed_out' || s === 'neutral' || s === 'skipped') {
                core.setFailed(`pre-commit.ci concluded with: ${s}`);
                break;
              }
              core.info(`Waiting for pre-commit.ci... (status: ${s ?? 'not yet created'})`);
              if (Date.now() - started > timeoutMs) {
                core.setFailed('Timed out waiting for pre-commit.ci to report');
                break;
              }
              await new Promise(r => setTimeout(r, intervalMs));
            }

      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
