# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
  # Kick PR-based run after Prerequisites completes
  workflow_run:
    workflows: ["Prerequisites"]
    types: [completed]

name: R-CMD-check

# Concurrency:
# - Pushes: one active run per branch
# - PR runs: unique per PR head SHA
# - workflow_run: unique per "Prerequisites" run id
concurrency:
  group: R-CMD-check-${{ github.event_name == 'push' && github.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  pull-requests: read

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

jobs:
  gate-prereqs:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      run_check: ${{ steps.gate.outputs.run_check }}
    steps:
      - name: Decide whether to run R-CMD-check (and kick PR re-run after prerequisites)
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Pushes to develop always run
            if (context.eventName === 'push') {
              core.setOutput('run_check', 'true');
              return;
            }

            // For PR runs: only proceed once "Prerequisites" succeeded for this head SHA
            if (context.eventName === 'pull_request') {
              const headSha = context.payload.pull_request.head.sha;

              // Find the "Prerequisites" workflow in this repo
              const wfs = await github.rest.actions.listRepoWorkflows({ owner, repo });
              const prereq = wfs.data.workflows.find(w => w.name === 'Prerequisites');
              if (!prereq) {
                core.setOutput('run_check', 'false');
                return;
              }

              // Find the latest completed "Prerequisites" run for this PR head SHA
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: prereq.id, event: 'pull_request', head_sha: headSha, status: 'completed', per_page: 1
              });
              const run = runs.data.workflow_runs?.[0];
              if (!run || run.conclusion !== 'success') {
                core.setOutput('run_check', 'false');
                return;
              }

              // Optionally verify both jobs succeeded (Spelling may be skipped if formatter pushed)
              const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id });
              const byName = n => jobs.data.jobs.find(j => (j.name || '').toLowerCase() === n);
              const fmt = byName('format');    // matches job name: "Format"
              const spl = byName('spelling');  // matches job name: "Spelling"
              const fmtOk = fmt && fmt.conclusion === 'success';
              const splOk = spl && (spl.conclusion === 'success' || spl.conclusion === 'skipped');

              core.setOutput('run_check', (fmtOk && splOk) ? 'true' : 'false');
              return;
            }

            // After "Prerequisites" completes successfully, re-run the latest PR-based R-CMD-check so it shows on the PR
            if (context.eventName === 'workflow_run') {
              const wr = context.payload.workflow_run;

              // Only respond to successful "Prerequisites" runs that were PR-triggered
              if ((wr.name || '') !== 'Prerequisites' || wr.conclusion !== 'success') {
                core.setOutput('run_check', 'false');
                return;
              }
              const isPR = wr.event === 'pull_request' || wr.event === 'pull_request_target';
              if (!isPR) {
                core.setOutput('run_check', 'false');
                return;
              }

              // Find this workflow (R-CMD-check)
              const wfs = await github.rest.actions.listRepoWorkflows({ owner, repo });
              const self = wfs.data.workflows.find(w => w.name === 'R-CMD-check');
              if (!self) {
                core.setOutput('run_check', 'false');
                return;
              }

              // Find the latest PR-based run of R-CMD-check for the same head SHA
              const prRuns = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: self.id, event: 'pull_request', head_sha: wr.head_sha, per_page: 1
              });
              const prRun = prRuns.data.workflow_runs?.[0];

              if (prRun) {
                // Request a re-run so the PR-attached run executes after prerequisites finished
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {
                  owner, repo, run_id: prRun.id
                });
              }
              // Skip performing the matrix on this workflow_run
              core.setOutput('run_check', 'false');
              return;
            }

            core.setOutput('run_check', 'false');

  R-CMD-check:
    needs: gate-prereqs
    if: needs.gate-prereqs.outputs.run_check == 'true'
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel',   http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    steps:
      # Checkout the right commit depending on the trigger
      - name: Checkout (push)
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Checkout (pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          install-system-requirements: true

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
