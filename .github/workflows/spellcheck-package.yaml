on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: spelling-check

permissions:
  contents: read
  checks: read

jobs:
  spelling-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Wait for pre-commit.ci
        if: ${{ github.event_name == 'pull_request' }}
        uses: lewagon/wait-on-check-action@master
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: pre-commit.ci - pr
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install spellchecker
        run: install.packages("spelling")
        shell: Rscript {0}

      - name: Spellcheck root directory (include vignettes)
        id: spellcheck
        run: |
          result <- spelling::spell_check_package()
          result
          if (length(result[[1]]) != 0) {
            stop("Spelling errors found (fix or add to WORDLIST)")
          }
        shell: Rscript {0}
