name: spelling-check

on:
  # Run on PRs targeting develop (open, reopen, new commits, and when moved out of draft)
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

  # Optional manual trigger
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to check (optional)"
        required: false
        default: ""

jobs:
  spelling-check:
    runs-on: ubuntu-latest

    # Skip on draft PRs; still allows manual runs
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          # Use provided ref for manual runs; otherwise use the event ref
          # (On pull_request events this is the merge ref; fine for spellcheck.
          # If you prefer the PR head commit, set ref: ${{ github.head_ref }} instead.)
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install spellchecker
        run: install.packages("spelling")
        shell: Rscript {0}

      - name: Spellcheck root directory (include vignettes)
        id: spellcheck
        run: |
          result <- spelling::spell_check_package()
          print(result)
          if (length(result[[1]]) != 0) {
            stop("Spelling errors found (fix or add to WORDLIST)")
          }
        shell: Rscript {0}
