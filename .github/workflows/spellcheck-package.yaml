on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

name: spelling-check

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  spelling-check:
    # Skip draft PRs; run on non-PR triggers and non-draft PR events
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Wait for pre-commit.ci to succeed
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const names = ['pre-commit.ci - pr', 'pre-commit.ci - push'];
            const timeoutMs = 15 * 60 * 1000;
            const intervalMs = 10 * 1000;
            const started = Date.now();

            async function getStatus() {
              const checks = await github.rest.checks.listForRef({ owner, repo, ref });
              const cr = checks.data.check_runs.find(r => names.includes(r.name));
              if (cr) {
                if (cr.status === 'completed') return cr.conclusion || 'failure';
                return 'pending';
              }
              const status = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref });
              const st = status.data.statuses.find(s => names.includes(s.context));
              if (st) return st.state;
              return null;
            }

            while (true) {
              const s = await getStatus();
              if (s === 'success') { core.info('pre-commit.ci status: success'); break; }
              if (['failure','error','cancelled','timed_out','neutral','skipped'].includes(s)) {
                core.setFailed(`pre-commit.ci concluded with: ${s}`); break;
              }
              core.info(`Waiting for pre-commit.ci... (status: ${s ?? 'not yet created'})`);
              if (Date.now() - started > timeoutMs) { core.setFailed('Timed out waiting for pre-commit.ci to report'); break; }
              await new Promise(r => setTimeout(r, intervalMs));
            }

      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install spellchecker
        run: install.packages("spelling")
        shell: Rscript {0}

      - name: Spellcheck root directory (include vignettes)
        id: spellcheck
        run: |
          result <- spelling::spell_check_package()
          result
          if (length(result[[1]]) != 0) {
            stop("Spelling errors found (fix or add to WORDLIST)")
          }
        shell: Rscript {0}
