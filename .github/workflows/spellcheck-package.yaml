on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: spelling-check

jobs:
  spelling-check:
    # Run on pre-commit.ci autofix commits in PRs; otherwise run on push
    if: ${{ github.event_name != 'pull_request' || github.actor == 'pre-commit-ci[bot]' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install spellchecker
        run: install.packages("spelling")
        shell: Rscript {0}

      - name: Spellcheck root directory (include vignettes)
        id: spellcheck
        run: |
          result <- spelling::spell_check_package()
          result
          if (length(result[[1]]) != 0) {
            stop("Spelling errors found (fix or add to WORDLIST)")
          }
        shell: Rscript {0}
