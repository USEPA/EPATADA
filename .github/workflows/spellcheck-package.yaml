on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

name: spelling-check

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

jobs:
  spelling-check:
    # Skip draft PRs; run on non-PR triggers and non-draft PR events
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Wait for pre-commit.ci
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const checkName = 'pre-commit.ci - pr';
            const timeoutMs = 15 * 60 * 1000;
            const intervalMs = 10 * 1000;
            const started = Date.now();
            while (true) {
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref });
              const check = data.check_runs.find(cr => cr.name === checkName);
              if (check) {
                if (check.status === 'completed') {
                  if (check.conclusion === 'success') {
                    core.info(`${checkName} succeeded`);
                    break;
                  }
                  core.setFailed(`${checkName} concluded with ${check.conclusion}`);
                  break;
                } else {
                  core.info(`${checkName} status: ${check.status}; waiting...`);
                }
              } else {
                core.info(`No check named "${checkName}" yet; waiting...`);
              }
              if (Date.now() - started > timeoutMs) {
                core.setFailed(`Timed out waiting for "${checkName}"`);
                break;
              }
              await new Promise(r => setTimeout(r, intervalMs));
            }

      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install spellchecker
        run: install.packages("spelling")
        shell: Rscript {0}

      - name: Spellcheck root directory (include vignettes)
        id: spellcheck
        run: |
          result <- spelling::spell_check_package()
          result
          if (length(result[[1]]) != 0) {
            stop("Spelling errors found (fix or add to WORDLIST)")
          }
        shell: Rscript {0}
